name: Build MCBE ESP .so

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find preinstalled NDK
        run: |
          NDK_PATH=$(ls -d $ANDROID_SDK_ROOT/ndk/* 2>/dev/null | sort -V | tail -1)
          if [ -z "$NDK_PATH" ]; then
            echo "No NDK found, installing..."
            echo "y" | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
            $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "ndk;25.2.9519653" > /dev/null
            NDK_PATH="$ANDROID_SDK_ROOT/ndk/25.2.9519653"
          fi
          echo "NDK_ROOT=$NDK_PATH" >> $GITHUB_ENV
          echo "Using NDK: $NDK_PATH"

      - name: Configure CMake
        run: |
          cmake -S mcbe-esp -B mcbe-esp/build \
            -DCMAKE_TOOLCHAIN_FILE=$NDK_ROOT/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-21 \
            -DCMAKE_BUILD_TYPE=Release \
            -G Ninja

      - name: Build .so
        run: cmake --build mcbe-esp/build --config Release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: libmcbe_esp-arm64
          path: mcbe-esp/build/libmcbe_esp.so
          retention-days: 30
