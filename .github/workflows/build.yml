name: Build MCBE ESP .so

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Android NDK
        uses: android-actions/setup-android@v3

      - name: Install NDK r25c
        run: |
          echo "y" | sdkmanager "ndk;25.2.9519653"
          echo "NDK_ROOT=$ANDROID_SDK_ROOT/ndk/25.2.9519653" >> $GITHUB_ENV

      - name: Configure CMake
        run: |
          cmake -S mcbe-esp -B mcbe-esp/build \
            -DCMAKE_TOOLCHAIN_FILE=$NDK_ROOT/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-21 \
            -DCMAKE_BUILD_TYPE=Release \
            -G Ninja

      - name: Build .so
        run: cmake --build mcbe-esp/build --config Release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: libmcbe_esp-arm64
          path: mcbe-esp/build/libmcbe_esp.so
          retention-days: 30
